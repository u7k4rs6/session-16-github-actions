name: Secrets demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  show-secret-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether DEMO_TOKEN is configured
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          if [ -n "$DEMO_TOKEN" ]; then
            echo "DEMO_TOKEN is configured"
          else
            echo "DEMO_TOKEN is not configured"
          fi
